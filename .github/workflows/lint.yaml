name: Lint
# https://github.com/marketplace/actions/action-eslint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mskelton/setup-yarn@v4.0.0
        with:
          node-version: 20
      - run: yarn
      - uses: sibiraj-s/action-eslint@v4
        with:
          eslint-args: "--fix"
          extensions: 'ts'
          annotations: true
          token: ${{ secrets.GITHUB_TOKEN }}
