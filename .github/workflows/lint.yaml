name: Lint
# https://github.com/marketplace/actions/action-eslint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mskelton/setup-yarn@v4.0.0
        with:
          node-version: 20
      - name: Install Yarn
        run: yarn
      - name: Run Eslint
        run: yarn run eslint \"{src,test,dist}/**/*.ts\" --fix
